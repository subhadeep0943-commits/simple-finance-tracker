<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Finance Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, button { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .total { font-size: 20px; font-weight: bold; margin-top: 20px; color: #333; }
        ul { list-style-type: none; padding: 0; }
        li { padding: 8px; background: #f4f4f4; margin-bottom: 5px; border-left: 5px solid #28a745; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <h2>My Expense Tracker</h2>
    <div class="total">Total Spent: $<span id="total-amount">0</span></div>
    <hr>

    <div class="input-group">
        <label for="reason">Description:</label>
        <input type="text" id="reason" placeholder="e.g., Lunch, Books">
    </div>

    <div class="input-group">
        <label for="amount">Amount ($):</label>
        <input type="number" id="amount" placeholder="e.g., 15">
    </div>

    <button id="add-btn">Add Expense</button>

    <h3>History</h3>
    <ul id="expense-list"></ul>

    <script src="app.js"></script>
</body>
</html>
